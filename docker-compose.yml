services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=postgres
      - NODE_ENV=development
      - SERVER_PORT=3000
      - JWT_SECRET=789456123
      - SEED_BD=true
      - SEED_UNITS=true
    depends_on:
      - db
    volumes:
      - .:/backend
      - /backend/node_modules

volumes:
  db_data: